id: auth-credential-stuffing
title: Credential stuffing - many accounts from one IP
status: stable
level: high
author: MiniSOC
description: One source IP fails to log in to many different accounts in a short time. Typical of credential stuffing with leaked username/password lists.
logsource: {category: authentication}
mitre: [T1110.004]
detection:
  selection:
    event_type: FailedLogin
  condition: selection
  aggregate: {function: distinct_count, field: username, group_by: [source_ip], timeframe: 10m, threshold: 8}
risk:
  - {entity: source_ip, score: 60}
dedup: 30m
message: "{source_ip} failed logins on {value} different accounts within {timeframe} (e.g. {sample})"
falsepositives: [Shared NAT / proxy egress IP of a large office, Load tests]
response: [block-attacker-ip]
tests:
  - name: ten accounts from one IP match
    expect: match
    events:
      - {event_type: FailedLogin, source_ip: 198.51.100.20, username: "user{i}", repeat: 10, step: 15s}
  - name: one account many times does not match
    expect: no_match
    events:
      - {event_type: FailedLogin, source_ip: 198.51.100.20, username: alice, repeat: 20, step: 5s}
