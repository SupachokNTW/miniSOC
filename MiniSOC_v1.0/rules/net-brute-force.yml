id: net-brute-force
title: Brute force reported by firewall/IPS
status: stable
level: medium
author: MiniSOC
description: Network device (e.g. Sangfor AF) reports a brute-force attack against an exposed service. Risk goes to the attacker and, at a lower weight, to the targeted asset.
logsource: {category: network}
mitre: [T1110]
detection:
  selection:
    event_type: BruteForce
  condition: selection
risk:
  - {entity: source_ip, score: 30}
  - {entity: dest_ip, score: 15}
dedup: 1h
message: "{source_ip} brute-forced {dest_ip}:{dest_port} ({attempts} attempts, action {action})"
response: [block-attacker-ip]
tests:
  - name: sangfor brute force matches
    expect: match
    events:
      - {event_type: BruteForce, source_ip: 203.0.113.4, dest_ip: 10.0.0.5, dest_port: "22", extra: {_attempts: 80}}
